<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AI Village: Realm of Shadows</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="ui-overlay">
      <canvas id="minimap-canvas" width="180" height="180"></canvas>
      <div id="resource-bar">
        <span id="res-wood">Wood: 50</span>
        <span id="res-stone">Stone: 30</span>
        <span id="res-food">Food: 40</span>
        <span id="res-iron">Iron: 5</span>
      </div>
      <div id="time-display">Day 1 — Dawn</div>
      <div id="faith-bar">
        <div id="faith-label">Faith</div>
        <div id="faith-track"><div id="faith-fill"></div></div>
      </div>
      <div id="villager-count">Villagers: 8</div>
      <div id="tick-controls">
        <button id="btn-pause">⏸</button>
        <button id="btn-speed1" class="active">▶</button>
        <button id="btn-speed2">▶▶</button>
        <button id="btn-speed3">▶▶▶</button>
        <button id="btn-settings" title="Settings">⚙</button>
      </div>
      <div id="guidance-panel" class="hidden">
        <div id="guidance-header">A villager seeks your counsel...</div>
        <div id="villager-question"></div>
        <textarea id="guidance-input" placeholder="Speak, Voice..." rows="3"></textarea>
        <button id="send-guidance">Counsel</button>
      </div>
      <!-- Settings Modal -->
      <div id="settings-overlay" class="hidden">
        <div id="settings-modal">
          <div id="settings-header">Settings</div>
          <div class="settings-section">
            <label for="openai-key">OpenAI API Key</label>
            <div class="key-input-row">
              <input type="password" id="openai-key" placeholder="sk-..." autocomplete="off">
              <button id="toggle-key-vis" title="Show/hide key">Show</button>
            </div>
            <div class="settings-note">Stored in your browser only. Sent directly to OpenAI — never to any other server.</div>
          </div>
          <div class="settings-section">
            <label for="openai-model">Model</label>
            <select id="openai-model">
              <option value="gpt-4o-mini">GPT-4o Mini (fast, cheap)</option>
              <option value="gpt-4o">GPT-4o (smarter, costs more)</option>
            </select>
          </div>
          <div class="settings-section">
            <button id="test-connection">Test Connection</button>
            <span id="test-result"></span>
          </div>
          <div class="settings-actions">
            <button id="save-settings">Save</button>
            <button id="close-settings">Cancel</button>
          </div>
        </div>
      </div>

      <div id="event-log">
        <div id="log-entries"></div>
      </div>
    </div>
  </div>
  <script src="js/main.js" type="module"></script>
</body>
</html>
