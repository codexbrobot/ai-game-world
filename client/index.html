<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AI Village: Realm of Shadows</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="ui-overlay">
      <div id="minimap-wrap">
        <canvas id="minimap-canvas" width="180" height="180"></canvas>
        <button id="minimap-toggle" title="Toggle minimap">M</button>
      </div>
      <div id="top-bar">
        <div id="resource-bar">
          <span id="res-wood">Wood: 30</span>
          <span id="res-stone">Stone: 15</span>
          <span id="res-food">Food: 30</span>
          <span id="res-iron">Iron: 0</span>
        </div>
      </div>
      <div id="time-display">Day 1 — Dawn</div>
      <div id="stats-card">
        <div id="stats-card-row">
          <span id="villager-count">12</span>
          <span class="stats-sep">|</span>
          <span id="food-tracker-label"><span id="food-current">30</span>/<span id="food-needed">12</span></span>
        </div>
        <div id="faith-bar">
          <div id="faith-label">Faith</div>
          <div id="faith-track"><div id="faith-fill"></div></div>
        </div>
        <div id="food-tracker">
          <div id="food-tracker-bar"><div id="food-tracker-fill"></div></div>
        </div>
      </div>
      <div id="tick-controls">
        <button id="btn-pause">⏸</button>
        <button id="btn-speed1" class="active">▶</button>
        <button id="btn-speed2">▶▶</button>
        <button id="btn-speed3">▶▶▶</button>
        <button id="btn-roster" title="Roster">&#x1F4DC;</button>
        <button id="btn-settings" title="Settings">⚙</button>
      </div>
      <!-- Roster Panel -->
      <div id="roster-panel" class="hidden">
        <div id="roster-header">
          <span>Village Roster</span>
          <button id="close-roster">X</button>
        </div>
        <div id="roster-list"></div>
      </div>
      <div id="guidance-panel" class="hidden">
        <div id="guidance-header">A villager seeks your counsel...</div>
        <div id="villager-question"></div>
        <textarea id="guidance-input" placeholder="Speak, Voice..." rows="3"></textarea>
        <button id="send-guidance">Counsel</button>
      </div>
      <!-- Settings Modal -->
      <div id="settings-overlay" class="hidden">
        <div id="settings-modal">
          <div id="settings-header">Settings</div>
          <div class="settings-section">
            <label for="openai-key">OpenAI API Key</label>
            <div class="key-input-row">
              <input type="password" id="openai-key" placeholder="sk-..." autocomplete="off">
              <button id="toggle-key-vis" title="Show/hide key">Show</button>
            </div>
            <div class="settings-note">Stored in your browser only. Sent directly to OpenAI — never to any other server.</div>
          </div>
          <div class="settings-section">
            <label for="openai-model">Model</label>
            <select id="openai-model">
              <option value="gpt-4o-mini">GPT-4o Mini (fast, cheap)</option>
              <option value="gpt-4o">GPT-4o (smarter, costs more)</option>
            </select>
          </div>
          <div class="settings-section">
            <button id="test-connection">Test Connection</button>
            <span id="test-result"></span>
          </div>
          <div class="settings-actions">
            <button id="save-settings">Save</button>
            <button id="close-settings">Cancel</button>
          </div>
        </div>
      </div>

      <!-- Villager Detail Panel -->
      <div id="villager-detail" class="hidden">
        <div id="vd-header">
          <div id="vd-tabs">
            <button class="vd-tab active" data-tab="stats">Stats</button>
            <button class="vd-tab" data-tab="story">Story</button>
            <button class="vd-tab" data-tab="thoughts">Thoughts</button>
          </div>
          <button id="vd-close">X</button>
        </div>
        <div id="vd-content"></div>
      </div>

      <div id="quest-tracker"></div>
      <div id="chain-alert" class="hidden"></div>
      <div id="event-log">
        <div id="log-filters">
          <button class="log-filter active" data-filter="all">All</button>
          <button class="log-filter" data-filter="combat">Combat</button>
          <button class="log-filter" data-filter="discovery">Discovery</button>
          <button class="log-filter" data-filter="village">Village</button>
          <button class="log-filter" data-filter="guidance">Guidance</button>
        </div>
        <div id="log-entries"></div>
      </div>
    </div>
  </div>
  <script src="js/main.js" type="module"></script>
</body>
</html>
